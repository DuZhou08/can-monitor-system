name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi python3-yaml

      - name: Build slave-sensors
        run: python3 scripts/build.py slave-sensors

      - name: Build slave-mpu
        run: python3 scripts/build.py slave-mpu

      - name: Build master
        run: python3 scripts/build.py master

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          if-no-files-found: error
          path: |
            master/build/ci/*.elf
            master/build/ci/*.hex
            master/build/ci/*.bin
            slave-sensors/build/ci/*.elf
            slave-sensors/build/ci/*.hex
            slave-sensors/build/ci/*.bin
            slave-mpu/build/ci/*.elf
            slave-mpu/build/ci/*.hex
            slave-mpu/build/ci/*.bin
