miscInfo:
  uid: 5e03b7cf312997f4a71556b46e411363
targets:
  Target1:
    cppPreprocessAttrs:
      defineList:
        - USE_STDPERIPH_DRIVER
        - STM32F40_41xxx
      incList:
        - start
        - library
        - user
        - system
        - hardware
        - FreeRtos/include
        - FreeRtos/portable/GCC_ARM_CM4F
        - FreeRtos/portable
        - FreeRtos/source
        - .cmsis/include
        - RTE/_Target 1
        - .
        - MYapp
        - commuication_protocol
        - lvgl
      libList: []
    excludeList: []
    settings:
      debugger: cortex-debug
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: ""
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
            C_FLAGS: -Wno-unknown-pragmas -Wno-misleading-indentation
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-0
            optimization-lto: false
            warnings: all-warnings
          global:
            $float-abi-type: hard
            misc-control: ""
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $disableOutputTask: false
            $outputTaskExcludes:
              - ""
            LD_FLAGS: ""
            LIB_FLAGS: ""
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: start/STM32F407VETx_FLASH.ld
        storageLayout:
          RAM:
            - id: 1
              isChecked: true
              mem:
                size: "0x20000"
                startAddr: "0x20000000"
              noInit: false
              tag: IRAM
          ROM:
            - id: 1
              isChecked: true
              isStartup: true
              mem:
                size: "0x80000"
                startAddr: "0x8000000"
              tag: IROM
        useCustomScatterFile: true
    uploadConfigMap:
      OpenOCD:
        baseAddr: "0x08000000"
        bin: ""
        interface: stlink
        target: stm32f4x
    uploader: OpenOCD
